[package]
name = "riptide"
version = "0.1.0"
edition = "2024"
description = "A fast, minimal BitTorrent client with a clean dark interface."
license = "MIT"
repository = "https://github.com/ethemdemirkaya/riptide"
readme = "README.md"
keywords = ["torrent", "bittorrent", "gui", "egui", "magnet"]
categories = ["network-programming", "gui"]

[dependencies]
anyhow = "1.0.105"
bytes = "1"
directories = "6"
eframe = "0.37"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Keep the GUI responsive in debug builds.
[profile.dev.package."*"]
opt-level = 2
