[package]
name = "riptide"
version = "0.1.0"
edition = "2024"
description = "A fast, minimal BitTorrent client with a clean dark interface."
license = "MIT"
repository = "https://github.com/ethemdemirkaya/riptide"
readme = "README.md"
keywords = ["torrent", "bittorrent", "gui", "egui", "magnet"]
categories = ["network-programming", "gui"]

[dependencies]
anyhow = "1.0.105"
bytes = "1"
directories = "6"
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Keep the GUI responsive in debug builds.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }

[build-dependencies]
winresource = "0.1"

# Windows installer, built with `cargo packager --release` (see README).
[package.metadata.packager]
product-name = "Riptide"
identifier = "dev.riptide.app"
publisher = "Ethem Demirkaya"
homepage = "https://github.com/ethemdemirkaya/riptide"
description = "A fast, quiet BitTorrent client written in Rust."
category = "Utility"
formats = ["nsis"]
out-dir = "target/installer"
before-packaging-command = "cargo build --release"
icons = ["assets/logo/icon-512.png", "assets/logo/riptide.ico"]
licenseFile = "LICENSE"

[[package.metadata.packager.binaries]]
path = "riptide"
main = true

[package.metadata.packager.nsis]
installer-mode = "currentUser"
installer-icon = "assets/logo/riptide.ico"
