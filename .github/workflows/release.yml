name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bin: riptide.exe
          - name: linux-x64
            os: ubuntu-latest
            bin: riptide
          - name: macos-arm64
            os: macos-latest
            bin: riptide
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "riptide-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/${{ matrix.bin }}, README.md, LICENSE $dir
          Compress-Archive $dir "$dir.zip"

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo install cargo-packager --locked
          cargo packager --release
          Copy-Item target/installer/*-setup.exe .
        shell: pwsh

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          dir="riptide-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir "$dir"
          cp target/release/${{ matrix.bin }} README.md LICENSE "$dir"
          tar czf "$dir.tar.gz" "$dir"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            riptide-${{ github.ref_name }}-${{ matrix.name }}.*
            *-setup.exe
          generate_release_notes: true
